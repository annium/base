name: Merge Request

on:
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: merge-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.check.outputs.run_full }}
    steps:
      - name: Check whether the full pipeline should run
        id: check
        run: echo "run_full=${{ !contains(github.event.pull_request.title, 'skip ci') }}" >> $GITHUB_OUTPUT

  run-short:
    runs-on: ubuntu-latest
    needs: init
    if: ${{ needs.init.outputs.run_full != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ci-merge-request-short

  run-full:
    runs-on: ubuntu-latest
    needs: init
    if: ${{ needs.init.outputs.run_full == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ci-merge-request-full

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: warn
          retention-days: 30

  report:
    runs-on: ubuntu-latest
    needs: [ init, run-full ]
    if: ${{ always() && needs.init.outputs.run_full == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download test results artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results
          path: test-results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: steps.download.outcome == 'success'
        with:
          trx_files: "test-results/**/*.trx"
